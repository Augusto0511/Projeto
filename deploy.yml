name: CD - GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-html:
    name: Lint HTML
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validar HTML
        run: npx --yes html-validate public/index.html

  test:
    name: Testes
    runs-on: ubuntu-latest
    needs: lint-html
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Executar testes
        run: npm test

  deploy:
    name: Publicar no GitHub Pages (gh-pages)
    runs-on: ubuntu-latest
    needs: [lint-html, test]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
      - name: Publicar site na branch gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
